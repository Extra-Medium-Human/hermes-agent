# Generated by .quality/workflow.py from .quality.json; regenerate after adapter changes.
name: Quality
run-name: Quality ${{ inputs.request_id || format('{0} · {1}', github.event_name, github.event.pull_request.number || github.ref_name) }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  schedule:
    - cron: '20 2 * * *'
      timezone: America/Denver
  workflow_dispatch:
    inputs:
      mode:
        description: Verification coverage
        type: choice
        options: [full, affected]
        default: full
      request_id:
        description: Automatic release fallback correlation (leave empty for ordinary runs)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'change' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base: ${{ steps.select.outputs.base }}
      head: ${{ steps.select.outputs.head }}
      mode: ${{ steps.select.outputs.mode }}
      has_checks: ${{ steps.select.outputs.has_checks }}
      matrix: ${{ steps.select.outputs.matrix }}
      runtimes: ${{ steps.select.outputs.runtimes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .quality/vendor.json ]; then python3 .quality/vendor.py verify; fi
          python3 .quality/ci.py select
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quality-selection
          path: .quality-results/*.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  checks:
    name: Checks (${{ matrix.runner }})
    needs: select
    if: ${{ needs.select.outputs.has_checks == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '${{ fromJSON(needs.select.outputs.runtimes).python }}'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ fromJSON(needs.select.outputs.runtimes).node != '' }}
        with:
          node-version: '${{ fromJSON(needs.select.outputs.runtimes).node }}'
      - name: Pinned package manager
        if: ${{ fromJSON(needs.select.outputs.runtimes).pnpm != '' }}
        env:
          PNPM_VERSION: ${{ fromJSON(needs.select.outputs.runtimes).pnpm }}
        run: npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: downloads
        if: ${{ matrix.bootstrap }}
        with:
          path: |
            .quality-cache/npm
            .quality-cache/pnpm
            .quality-cache/pip
            .quality-cache/ms-playwright

          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.quality.json', '.quality/**', '**/package-lock.json', '**/pnpm-lock.yaml', '**/uv.lock', '**/requirements*.txt', '**/Cargo.lock', '**/next.config.*', '**/tsconfig.json') }}
      - run: npm install --global npm@10.9.8 --ignore-scripts
      - run: python3 -m pip install --disable-pip-version-check uv==0.12.9
      - name: Bootstrap disposable test environment
        if: ${{ matrix.bootstrap }}
        env:
          QUALITY_RUNNER: ${{ matrix.runner }}
        run: |
          if [ -f .quality/vendor.json ]; then python3 .quality/vendor.py verify; fi
          python3 .quality/quality.py doctor
          python3 .quality/quality.py bootstrap --runner "$QUALITY_RUNNER"
      - name: Run selected checks once
        env:
          QUALITY_BASE: ${{ needs.select.outputs.base }}
          QUALITY_HEAD: ${{ needs.select.outputs.head }}
          QUALITY_MODE: ${{ needs.select.outputs.mode }}
          QUALITY_CACHE_HIT: ${{ steps.downloads.outputs.cache-hit }}
          QUALITY_RUNNER: ${{ matrix.runner }}
        run: |
          command=run
          if [ "$QUALITY_MODE" = full ]; then command=full; fi
          python3 .quality/quality.py "$command" --base "$QUALITY_BASE" --head "$QUALITY_HEAD" --runner "$QUALITY_RUNNER" --evidence-dir .quality-checks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: checks-${{ matrix.runner }}
          path: |
            .quality-checks/*.json
            .quality-checks/*.log
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error


  quality:
    name: Quality
    needs: [select, checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: quality-selection
          path: .quality-results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.select.outputs.has_checks == 'true' }}
        with:
          pattern: checks-*
          path: .quality-results/checks
          merge-multiple: true
      - name: Reject incomplete or failed verification
        if: always()
        env:
          QUALITY_NEEDS: ${{ toJSON(needs) }}
        run: |
          mkdir -p .quality-results
          python3 -c 'import os,pathlib; pathlib.Path(".quality-results/needs.json").write_text(os.environ["QUALITY_NEEDS"])'
          python3 .quality/ci.py aggregate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quality-evidence
          path: .quality-results/**/*.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
